<pre id=i></pre>
<script>
/* ============================== SHADERS ============================== */
//WGSL-START
const COMMON=`
struct U{vp:mat4x4f,view:mat4x4f,ivp:mat4x4f,lvp:mat4x4f,cam:vec4f,grid:vec4f,misc:vec4f,fog:vec4f,sun:vec4f,sunC:vec4f,vis:vec4f,skyp:vec4f,scr:vec4f,proj:vec4f,sh:array<vec4f,9>};
@group(0)@binding(0)var<uniform>u:U;
const PI=3.14159265;
fn ss(a:f32,b:f32,x:f32)->f32{let t=clamp((x-a)/(b-a),0.,1.);return t*t*(3.-2.*t);}
fn h31(p:vec3f)->f32{var q=fract(p*vec3f(.1031,.1030,.0973));q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
fn vn(p:vec3f)->f32{let i=floor(p);let f=fract(p);let w=f*f*(3.-2.*f);
 return mix(mix(mix(h31(i),h31(i+vec3f(1.,0.,0.)),w.x),mix(h31(i+vec3f(0.,1.,0.)),h31(i+vec3f(1.,1.,0.)),w.x),w.y),
            mix(mix(h31(i+vec3f(0.,0.,1.)),h31(i+vec3f(1.,0.,1.)),w.x),mix(h31(i+vec3f(0.,1.,1.)),h31(i+vec3f(1.,1.,1.)),w.x),w.y),w.z);}
fn rot(v:vec3f,a:f32,ax:f32)->vec3f{let c=cos(a);let s=sin(a);
 if(ax>.5){return vec3f(v.x,s*v.z+c*v.y,c*v.z-s*v.y);}
 return vec3f(c*v.x-s*v.y,s*v.x+c*v.y,v.z);}
fn skyDir(d:vec3f)->vec3f{return vec3f(u.skyp.z*d.x-u.skyp.w*d.z,d.y,u.skyp.w*d.x+u.skyp.z*d.z);}
fn shIrr(n0:vec3f)->vec3f{let n=skyDir(n0);let x=n.x;let y=n.y;let z=n.z;
 return max(vec3f(0.),u.sh[0].rgb*.282095+u.sh[1].rgb*(.488603*y)+u.sh[2].rgb*(.488603*z)+u.sh[3].rgb*(.488603*x)
  +u.sh[4].rgb*(1.092548*x*y)+u.sh[5].rgb*(1.092548*y*z)+u.sh[6].rgb*(.315392*(3.*z*z-1.))+u.sh[7].rgb*(1.092548*x*z)+u.sh[8].rgb*(.546274*(x*x-y*y)))*u.skyp.y;}
fn octE(n:vec3f)->vec2f{var p=n.xy/(abs(n.x)+abs(n.y)+abs(n.z));if(n.z<0.){p=(1.-abs(p.yx))*select(vec2f(-1.),vec2f(1.),p>=vec2f(0.));}return p;}
fn octD(e:vec2f)->vec3f{var n=vec3f(e,1.-abs(e.x)-abs(e.y));if(n.z<0.){n=vec3f((1.-abs(n.yx))*select(vec2f(-1.),vec2f(1.),n.xy>=vec2f(0.)),n.z);}return normalize(n);}
fn ggx(N:vec3f,V:vec3f,L:vec3f,r:f32,F0:vec3f)->vec3f{let H=normalize(V+L);let nh=max(dot(N,H),0.);let nv=max(dot(N,V),1e-3);let nl=max(dot(N,L),1e-3);
 let a=max(r*r,.0025);let a2=a*a;let d=nh*nh*(a2-1.)+1.;let D=a2/(PI*d*d);let k=a*.5;let G=1./((nv*(1.-k)+k)*(nl*(1.-k)+k));
 let F=F0+(1.-F0)*pow(1.-max(dot(H,V),0.),5.);return D*G*F*.25;}
`;
// sky lookup: needs skyT + smpR declared by the module
const SKYFN=`
fn skyRad(d0:vec3f)->vec3f{let d=skyDir(d0);
 let uv=vec2f(atan2(d.x,-d.z)/(2.*PI)+.5,min(acos(clamp(d.y,-1.,1.))/PI*2.,.996));
 let s=textureSampleLevel(skyT,smpR,uv,0.).rgb;return u.skyp.x*s/max(1.-s,vec3f(.03))*u.skyp.y;}
`;
const SCENE_WGSL=COMMON+SKYFN+`
struct Lt{p:vec4f,c:vec4f};
@group(0)@binding(1)var<storage,read>LS:array<Lt>;
@group(0)@binding(2)var<storage,read>GR:array<u32>;
@group(0)@binding(3)var atl:texture_2d<f32>;
@group(0)@binding(4)var smp:sampler;
@group(0)@binding(5)var albT:texture_2d_array<f32>;
@group(0)@binding(6)var nrT:texture_2d_array<f32>;
@group(0)@binding(7)var shT:texture_depth_2d;
@group(0)@binding(8)var cmp:sampler_comparison;
@group(0)@binding(9)var visT:texture_3d<f32>;
@group(0)@binding(10)var skyT:texture_2d<f32>;
@group(0)@binding(11)var smpR:sampler;
const STRIDE=33u;
struct VO{
 @builtin(position)pos:vec4f,
 @location(0)wp:vec3f,
 @location(1)n:vec3f,
 @location(2)col:vec3f,
 @location(3)@interpolate(flat)m:vec4f,
 @location(4)lp:vec3f,
 @location(5)@interpolate(flat)ln:vec3f,
 @location(6)@interpolate(flat)sg:vec4f,
};
struct FO{@location(0)c:vec4f,@location(1)g:vec4f,@location(2)a:vec4f};
@vertex fn vs(@location(0)p:vec3f,@location(1)n:vec3f,@location(2)a:vec4f,@location(3)b:vec4f,@location(4)c:vec4f,@location(5)d:vec4f)->VO{
 var o:VO;
 o.wp=rot(p*b.xyz,a.w,d.w)+a.xyz;o.n=rot(n,a.w,d.w);
 o.col=c.rgb;o.m=vec4f(b.w,c.w,d.z,d.w);o.lp=p;o.ln=n;o.sg=d;
 o.pos=u.vp*vec4f(o.wp,1.);
 return o;
}
fn shadow(p:vec3f,soft:f32)->f32{
 let s=u.lvp*vec4f(p,1.);let uv=s.xy*vec2f(.5,-.5)+.5;
 if(any(uv<vec2f(0.))||any(uv>vec2f(1.))||s.z>1.||u.sun.w<.5){return 0.;}
 let ts=soft/vec2f(textureDimensions(shT));var acc=0.;
 for(var y=-1;y<=1;y++){for(var x=-1;x<=1;x++){acc+=textureSampleCompareLevel(shT,cmp,uv+vec2f(f32(x),f32(y))*ts,s.z-.0004);}}
 return acc/9.;
}
// material table: layer, metres per tile, normal strength, roughness scale
fn matOf(p:i32)->vec4f{
 if(p==1){return vec4f(0.,1.5,1.,.2);}
 if(p==7){return vec4f(0.,3.,1.,.16);}
 if(p==2){return vec4f(2.,1.7,1.,.55);}
 if(p==10){return vec4f(1.,2.3,1.,.32);}
 if(p==11){return vec4f(3.,2.,.5,1.);}
 return vec4f(-1.,1.,0.,1.);
}
@fragment fn fs(i:VO)->FO{
 let t=u.cam.w;
 let wp=i.wp;
 let V0=u.cam.xyz-wp;let dist=length(V0);let V=V0/max(dist,1e-4);
 var Ng=normalize(i.n);
 if(dot(Ng,V)<0.){Ng=-Ng;}
 // sign lettering (sampled unconditionally to keep derivatives valid)
 let f=i32(i.sg.y+.5);
 var fd=vec3f(0.,0.,1.);var rt=vec3f(1.,0.,0.);
 if(f==1){fd=vec3f(0.,0.,-1.);rt=vec3f(-1.,0.,0.);}
 else if(f==2){fd=vec3f(1.,0.,0.);rt=vec3f(0.,0.,-1.);}
 else if(f==3){fd=vec3f(-1.,0.,0.);rt=vec3f(0.,0.,1.);}
 let si=max(i.sg.x,0.);
 let cl=vec2f(si-u.misc.z*floor(si/u.misc.z),floor(si/u.misc.z));
 let suv=clamp(vec2f(dot(i.lp,rt)+.5,.5-i.lp.y),vec2f(.004),vec2f(.996));
 let tx=textureSample(atl,smp,(cl+suv)/u.misc.zw).r;
 // photo materials: box-projected in world space
 var pat=i32(i.m.z+.5);
 if((pat==1||pat==7)&&Ng.y<-.5){pat=11;}
 let M=matOf(pat);
 let an=abs(Ng);var uv=wp.xz;var T=vec3f(1.,0.,0.);var Bt=vec3f(0.,0.,1.);
 if(an.x>an.y&&an.x>an.z){uv=vec2f(wp.z,-wp.y);T=vec3f(0.,0.,1.);Bt=vec3f(0.,-1.,0.);}
 else if(an.z>an.y){uv=vec2f(wp.x,-wp.y);T=vec3f(1.,0.,0.);Bt=vec3f(0.,-1.,0.);}
 let lay=max(i32(M.x),0);
 let ta=textureSample(albT,smpR,uv/M.y,lay);
 let tn=textureSample(nrT,smpR,uv/M.y,lay);
 var base=i.col;var emis=i.col*i.m.x;var rough=clamp(1.-i.m.y*.9,.06,1.);var metal=0.;
 var N=Ng;
 if(M.x>-.5){
  let tint=i.col/max(dot(i.col,vec3f(.3333)),.02);
  let lum=dot(ta.rgb,vec3f(.3,.59,.11));
  if(pat==11){base=i.col*(.62+.38*lum/.6);}
  else if(pat==10){base=ta.rgb*mix(vec3f(1.),tint,.55)*1.15;}
  else if(pat==2){base=ta.rgb*mix(vec3f(1.),tint,.15);}
  else{base=ta.rgb*mix(vec3f(1.),tint,.35)*1.05;}
  let nx=(tn.rg*2.-1.)*M.z;
  N=normalize(T*nx.x+Bt*nx.y+Ng*sqrt(max(.05,1.-dot(nx,nx))));
  rough=clamp(tn.b*M.w,.05,1.);
 }
 if(i.m.y>.75&&M.x<0.){metal=1.;rough=clamp(1.-i.m.y,.12,.5);}
 if(i.sg.x>-.5){
  if(dot(i.ln,fd)>.5){emis=i.col*i.m.x*tx;base=vec3f(.02);}else{emis=vec3f(0.);base=vec3f(.03);}
 }
 let up=abs(Ng.y)>.5;
 if(pat==3){ // carpet
  base*=.8+.35*vn(wp*9.);rough=1.;
 }else if(pat==4&&!up){ // stripes
  base*=mix(1.,.55,step(.5,fract((wp.x+wp.z)*1.4)));
 }else if(pat==5){ // screens
  emis*=.55+.45*sin(dot(wp,vec3f(3.,9.,3.))-t*2.5+h31(floor(wp*.7))*6.283);rough=.1;
 }else if(pat==6&&!up){ // ribbed shutter
  base*=.6+.4*step(.35,fract(wp.y*6.));
 }else if(pat==8){ // water
  let w=sin(wp.x*3.+t)+sin(wp.z*3.7-t*1.3)+sin((wp.x+wp.z+wp.y)*2.3+t*.7);emis*=.75+.12*w;rough=.05;
 }else if(pat==9&&!up){ // shelves of goods
  let h=h31(vec3f(floor(wp.x*12.),floor(wp.z*12.),floor(wp.y*2.2)));
  let bc=.5+.5*cos(6.2831*(h+vec3f(0.,.33,.67)));let sh=fract(wp.y*2.2);
  base=mix(bc*bc*.7*(.7+.3*h31(vec3f(floor(wp.x*40.),floor(wp.z*40.),3.))),i.col*.5,step(sh,.1));
 }
 let F0=mix(vec3f(.04),base,metal);let dif=base*(1.-metal);
 let NV=max(dot(N,V),1e-3);
 // baked sky visibility + ambient occlusion (from the compute pass)
 let vc=(wp+Ng*.55-u.vis.xyz)*u.vis.w/vec3f(textureDimensions(visT));
 let vv=textureSampleLevel(visT,smp,vc,0.);
 let skyV=vv.r;let ao=vv.g;
 var acc=dif*shIrr(N)/PI*skyV;
 acc+=dif*mix(vec3f(.09,.075,.065),vec3f(.15,.145,.15),N.y*.5+.5)*u.misc.y*ao;
 let R=reflect(-V,N);
 let Fv=F0+(1.-F0)*pow(1.-NV,5.);
 acc+=Fv*shIrr(R)/PI*skyV*ss(.3,.55,rough)*ao;
 // the sun, through the glass roof
 let Ls=u.sun.xyz;let nlg=dot(Ng,Ls);
 if(nlg>0.){
  let sh=shadow(wp+Ng*.05,1.3);
  if(sh>0.){acc+=u.sunC.rgb*sh*max(dot(N,Ls),0.)*(dif/PI+ggx(N,V,Ls,rough,F0));}
 }
 // shop and concourse lights
 let lvl=select(0u,1u,wp.y>5.99);
 let gc=floor((wp.xz-u.grid.xy)/u.grid.z);
 if(gc.x>=0.&&gc.y>=0.&&gc.x<u.grid.w&&gc.y<u.misc.x){
  let bi=(lvl*u32(u.grid.w*u.misc.x)+u32(gc.y*u.grid.w+gc.x))*STRIDE;
  let cnt=GR[bi];
  for(var k=1u;k<=cnt;k++){
   let L=LS[GR[bi+k]];
   let d=L.p.xyz-wp;let d2=dot(d,d);let r2=L.p.w*L.p.w;
   if(d2>=r2){continue;}
   let Ld=d*inverseSqrt(max(d2,1e-4));
   let x=d2/r2;let win=1.-x*x;
   var att=win*win/(1.+d2*.25);
   if(L.c.w>0.){if(h31(vec3f(floor(t*13.),L.c.w,7.))<.14){att*=.06;}}
   let nd=max(dot(N,Ld),0.);
   if(nd<=0.){continue;}
   acc+=L.c.rgb*att*nd*(dif*(.4+.6*ao)+ggx(N,V,Ld,max(rough,.12),F0)*PI*.6);
  }
 }
 var col=acc+emis;
 col=mix(col,u.fog.yzw,1.-exp(-dist*u.fog.x));
 let vn3=(u.view*vec4f(N,0.)).xyz;
 let vd=-(u.view*vec4f(wp,1.)).z;
 var o:FO;
 o.c=vec4f(col,1.);
 o.g=vec4f(octE(normalize(vn3)),vd,0.);
 o.a=vec4f(rough,metal,skyV,1.);
 return o;
}
// ---- sky behind the glass ----
@vertex fn vsSky(@builtin(vertex_index)i:u32)->@builtin(position)vec4f{return vec4f(f32(i32(i&1u)*4-1),f32(i32(i>>1u)*4-1),1.,1.);}
@fragment fn fsSky(@builtin(position)fc:vec4f)->FO{
 let ndc=vec2f(fc.x*u.scr.z*2.-1.,1.-fc.y*u.scr.w*2.);
 let w=u.ivp*vec4f(ndc,1.,1.);let d=normalize(w.xyz/w.w-u.cam.xyz);
 var c=skyRad(d);
 let sd=dot(d,u.sun.xyz);
 c+=u.sunC.rgb*(ss(.99997,.999992,sd)*90.+pow(max(sd,0.),900.)*1.5+pow(max(sd,0.),60.)*.05);
 var o:FO;o.c=vec4f(c,1.);o.g=vec4f(0.,0.,6e4,0.);o.a=vec4f(1.,0.,1.,0.);return o;
}
// ---- glass: thin tinted panes, blended over what is behind ----
@fragment fn fsGlass(i:VO)->@location(0)vec4f{
 let V=normalize(u.cam.xyz-i.wp);var N=normalize(i.n);if(dot(N,V)<0.){N=-N;}
 let nv=max(dot(N,V),0.);let F=.04+.96*pow(1.-nv,5.);
 let R=reflect(-V,N);
 var refl=mix(vec3f(.16,.13,.11),vec3f(.3,.26,.22),ss(-.5,.5,R.y));
 if(R.y>.05){refl=skyRad(R)*.6;}
 let g=dot(N,u.sun.xyz);
 if(g>0.){refl+=u.sunC.rgb*ggx(N,V,u.sun.xyz,.05,vec3f(.04))*g/max(F,.04)*.2;}
 let dirt=vn(i.wp*vec3f(.6,2.5,.6))*.6+vn(i.wp*3.1)*.4;
 let a=(1.-F)*(.86-.07*dirt);
 return vec4f(refl*F+vec3f(.012,.013,.012)*dirt,a);
}`;
const SHADOW_WGSL=COMMON+`
@vertex fn vs(@location(0)p:vec3f,@location(1)n:vec3f,@location(2)a:vec4f,@location(3)b:vec4f,@location(4)c:vec4f,@location(5)d:vec4f)->@builtin(position)vec4f{
 return u.lvp*vec4f(rot(p*b.xyz,a.w,d.w)+a.xyz,1.);}`;
// sky visibility + ambient occlusion, baked once from the collision grid
const VIS_WGSL=`
@group(0)@binding(0)var occ:texture_3d<u32>;
@group(0)@binding(1)var outT:texture_storage_3d<rgba8unorm,write>;
@group(0)@binding(2)var<uniform>vp:vec4f;
fn solid(p:vec3f)->bool{
 let g=floor((p-vec3f(-150.,-1.,-85.))/.5);
 if(g.x<0.||g.y<0.||g.z<0.||g.x>=600.||g.z>=340.){return true;}
 if(g.y>=30.){return false;}
 return textureLoad(occ,vec3i(g),0).r>0u;
}
@compute @workgroup_size(4,4,4) fn main(@builtin(global_invocation_id)id:vec3u){
 let dims=textureDimensions(outT);if(any(id>=dims)){return;}
 let c=vec3f(-150.,-1.,-85.)+vec3f(id)+.5;

 {binding:3,resource:atlas.createView()},{binding:4,resource:lin},{binding:5,resource:albT.createView({dimension:'2d-array'})},{binding:6,resource:nrT.createView({dimension:'2d-array'})},

let T=null;
function resize(){
 const lim=device.limits.maxTextureDimension2D,k=Math.min(devicePixelRatio||1,2)*SCALE[detail];

 if(T&&T.W===W&&T.H===H)return;if(T)T.list.forEach(t=>t.destroy());
 cv.width=W;cv.height=H;const list=[],mk=(w,h,f,u,sc=1)=>{const t=device.createTexture({size:[w,h],format:f,usage:u,sampleCount:sc});list.push(t);return t.createView()};
 const hw=Math.max(1,W>>1),hh=Math.max(1,H>>1);
 const t={W,H,list,mC:mk(W,H,'rgba16float',RA,4),mG:mk(W,H,'rgba16float',RA,4),mA:mk(W,H,'rgba8unorm',RA,4),depthV:mk(W,H,'depth24plus',RA,4),
  hdrV:mk(W,H,'rgba16float',RA|TB),gbV:mk(W,H,'rgba16float',RA|TB),axV:mk(W,H,'rgba8unorm',RA|TB),fxR:mk(hw,hh,'rgba16float',RA|TB),fxV:mk(hw,hh,'rgba16float',RA|TB),litV:mk(W,H,'rgba16float',RA|TB)};
 const dv=[];let w=W,h=H;for(let i=0;i<BLV;i++){w=Math.max(1,w>>1);h=Math.max(1,h>>1);dv.push(mk(w,h,'rgba16float',RA|TB))}
 t.dv=dv;if(SNAP){t.snapTex=device.createTexture({size:[W,H],format:fmt,usage:RA|TU.COPY_SRC});list.push(t.snapTex)}
 t.fxBG=bg(fxPipe,[{buffer:ubuf},t.gbV,t.axV,t.hdrV,shV,cmpS,clampS,skyTex.createView(),rep]);
 t.combBG=bg(combPipe,[{buffer:ubuf},t.hdrV,t.gbV,t.axV,t.fxR,t.fxV,clampS]);
 t.downBG=dv.map((_,i)=>bg(i?downPipe:down0Pipe,[i?dv[i-1]:t.litV,clampS]));

resize();addEventListener('resize',resize);

/* ---------- player ---------- */
const solid=(x,y,z)=>{const i=Math.floor((x-GX0)/GC),j=Math.floor((y-GY0)/GC),k=Math.floor((z-GZ0)/GC);
 if(i<0||j<0||k<0||i>=GNX||j>=GNY||k>=GNZ)return 1;return M.grid[i+GNX*(j+GNY*k)]};
const hit=(x,y,z)=>{if(y>11.7||y<.5)return true;for(const dy of[-.9,-.45,0,.25])for(const dx of[-.3,.3])for(const dz of[-.3,.3])if(solid(x+dx,y+dy,z+dz))return true;return false};
const VIEWS=[[-34,1.7,1.2,-Math.PI/2+.1,.2],[-1.75,1.7,-21,Math.PI,.32],[14,7.7,-19,Math.PI*.75,-.05],[-100,7.7,5,-Math.PI/2,.1],[60,1.7,19,Math.PI,0],[100,1.7,-4.5,-Math.PI/2,.04]];
const P={x:0,y:0,z:0,yaw:0,pitch:0,vx:0,vy:0,vz:0};
const view=i=>{const v=VIEWS[i];P.x=v[0];P.y=v[1];P.z=v[2];P.yaw=v[3];P.pitch=v[4];P.vx=P.vy=P.vz=0};view(QS.has('v')?+QS.get('v'):0);
if(QS.has('yaw'))P.yaw=+QS.get('yaw');if(QS.has('pitch'))P.pitch=+QS.get('pitch');
const keys=new Set(),ptrs=new Map();let primary=null,playing=false,stats=false,muted=false;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{if(!playing)return;try{cv.setPointerCapture(e.pointerId)}catch{}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(primary===null)primary=e.pointerId});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(e.pointerId===primary){const k=e.pointerType==='touch'?.006:.0045;P.yaw-=dx*k;P.pitch=Math.max(-1.45,Math.min(1.45,P.pitch-dy*k))}});
const up=e=>{ptrs.delete(e.pointerId);if(e.pointerId===primary)primary=ptrs.size?ptrs.keys().next().value:null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.repeat)return;const c=e.code;
 if(c==='Escape'){playing?pause():body.classList.contains('r')&&play();return}
 if(!playing)return;keys.add(c);
 if(c==='KeyM')setMute(!muted);if(c==='KeyH'){stats=!stats;if(!stats)$('i').textContent=''}
 if(/^Digit[1-6]$/.test(c))view(+c[5]-1)});
addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>{keys.clear();ptrs.clear();primary=null});

function update(dt){
 const k=c=>keys.has(c)?1:0,cy=Math.cos(P.yaw),sy=Math.sin(P.yaw),cp=Math.cos(P.pitch),sp=Math.sin(P.pitch);
 const fwd=[-sy*cp,sp,-cy*cp],rt=[cy,0,-sy];
 let f=0,s=0,vu=0,fast=keys.has('ShiftLeft')||keys.has('ShiftRight');
 if(playing){f=k('KeyW')+k('ArrowUp')-k('KeyS')-k('ArrowDown')+(ptrs.size?1:0);s=k('KeyD')+k('ArrowRight')-k('KeyA')-k('ArrowLeft');vu=k('KeyE')+k('Space')-k('KeyQ')-k('KeyC');if(ptrs.size>1)fast=true}
 f=Math.max(-1,Math.min(1,f));
 let wx=fwd[0]*f+rt[0]*s,wy=fwd[1]*f+vu,wz=fwd[2]*f+rt[2]*s;const l=Math.hypot(wx,wy,wz);
 const spd=fast?11:4.2;if(l>1){wx/=l;wy/=l;wz/=l}
 const a=Math.min(1,dt*(l?4:3));P.vx+=(wx*spd-P.vx)*a;P.vy+=(wy*spd-P.vy)*a;P.vz+=(wz*spd-P.vz)*a;
 const stuck=hit(P.x,P.y,P.z);
 const tryMove=(ax,v)=>{const n={x:P.x,y:P.y,z:P.z};n[ax]+=v*dt;if(stuck||!hit(n.x,n.y,n.z))P[ax]=n[ax];else P['v'+ax]*=-.1};
 tryMove('x',P.vx);tryMove('y',P.vy);tryMove('z',P.vz);
 return{fwd}}

/* ---------- audio: soft mall muzak ---------- */
let actx=null,master=null;
function startAudio(){if(actx){actx.resume();return}try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch{return}
 master=actx.createGain();master.gain.value=muted?0:.55;const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1700;
 const dl=actx.createDelay(1),fb=actx.createGain(),wet=actx.createGain();dl.delayTime.value=.37;fb.gain.value=.4;wet.gain.value=.35;
 lp.connect(master);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master);master.connect(actx.destination);
 const nb=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
 const ns=actx.createBufferSource(),nf=actx.createBiquadFilter(),ng=actx.createGain();ns.buffer=nb;ns.loop=true;nf.type='lowpass';nf.frequency.value=240;ng.gain.value=.06;ns.connect(nf);nf.connect(ng);ng.connect(master);ns.start();
 const CH=[[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,65]],mf=m=>440*2**((m-69)/12);let ci=0,next=actx.currentTime+.2;
 const note=(m,t0,dur,vol,type)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=mf(m);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.35);g.gain.setTargetAtTime(0,t0+dur-.5,.3);o.connect(g);g.connect(lp);o.start(t0);o.stop(t0+dur+1.5)};
 setInterval(()=>{if(!actx||actx.state!=='running')return;while(next<actx.currentTime+1){const c=CH[ci++%4];c.forEach(m=>note(m,next,4.2,.03,'triangle'));note(c[0]-12,next,4.2,.05,'sine');
  for(let q=0;q<4;q++)if(Math.random()<.55)note(c[Math.floor(Math.random()*4)]+12,next+q+Math.random()*.2,.9,.03,'sine');next+=4}},250)}
function setMute(v){muted=v;if(master)master.gain.setTargetAtTime(v?0:.55,actx.currentTime,.1)}

/* ---------- menu ---------- */
const qb=[...$('q').querySelectorAll('button')];
const setDetail=d=>{detail=d;qb.forEach((b,i)=>b.classList.toggle('on',i===d));try{localStorage.skyMallDetail=d}catch{}resize()};setDetail(detail);
qb.forEach((b,i)=>b.onclick=()=>setDetail(i));
function play(){playing=true;body.classList.add('g');startAudio();cv.focus?.()}
function pause(){playing=false;body.classList.remove('g');keys.clear();ptrs.clear();primary=null}
$('d').onclick=play;$('o').onclick=pause;

/* ---------- render loop ---------- */
function inv4(m){const a=m,r=new Array(16);
 const b00=a[0]*a[5]-a[1]*a[4],b01=a[0]*a[6]-a[2]*a[4],b02=a[0]*a[7]-a[3]*a[4],b03=a[1]*a[6]-a[2]*a[5],b04=a[1]*a[7]-a[3]*a[5],b05=a[2]*a[7]-a[3]*a[6],
  b06=a[8]*a[13]-a[9]*a[12],b07=a[8]*a[14]-a[10]*a[12],b08=a[8]*a[15]-a[11]*a[12],b09=a[9]*a[14]-a[10]*a[13],b10=a[9]*a[15]-a[11]*a[13],b11=a[10]*a[15]-a[11]*a[14];
 const d=1/(b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06);
 r[0]=(a[5]*b11-a[6]*b10+a[7]*b09)*d;r[1]=(a[2]*b10-a[1]*b11-a[3]*b09)*d;r[2]=(a[13]*b05-a[14]*b04+a[15]*b03)*d;r[3]=(a[10]*b04-a[9]*b05-a[11]*b03)*d;
 r[4]=(a[6]*b08-a[4]*b11-a[7]*b07)*d;r[5]=(a[0]*b11-a[2]*b08+a[3]*b07)*d;r[6]=(a[14]*b02-a[12]*b05-a[15]*b01)*d;r[7]=(a[8]*b05-a[10]*b02+a[11]*b01)*d;
 r[8]=(a[4]*b10-a[5]*b08+a[7]*b06)*d;r[9]=(a[1]*b08-a[0]*b10-a[3]*b06)*d;r[10]=(a[12]*b04-a[13]*b02+a[15]*b00)*d;r[11]=(a[9]*b02-a[8]*b04-a[11]*b00)*d;
 r[12]=(a[5]*b07-a[4]*b09-a[6]*b06)*d;r[13]=(a[0]*b09-a[1]*b07+a[2]*b06)*d;r[14]=(a[13]*b01-a[12]*b03-a[14]*b00)*d;r[15]=(a[8]*b03-a[9]*b01+a[10]*b00)*d;return r}
const pp=new Float32Array(4),VP=new Array(16);
let last=performance.now(),fpsT=0,fpsN=0,fps=0,frames=0;
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;fpsT+=dt;fpsN++;if(fpsT>.5){fps=Math.round(fpsN/fpsT);fpsT=fpsN=0}
 const{fwd}=update(dt),t=now/1000;
 const e=[P.x,P.y,P.z],upv=[0,1,0],r=[fwd[1]*upv[2]-fwd[2]*upv[1],fwd[2]*upv[0]-fwd[0]*upv[2],fwd[0]*upv[1]-fwd[1]*upv[0]],rl=Math.hypot(...r);r[0]/=rl;r[1]/=rl;r[2]/=rl;
 const uu=[r[1]*fwd[2]-r[2]*fwd[1],r[2]*fwd[0]-r[0]*fwd[2],r[0]*fwd[1]-r[1]*fwd[0]];
 const V=[r[0],uu[0],-fwd[0],0,r[1],uu[1],-fwd[1],0,r[2],uu[2],-fwd[2],0,-dot3(r,e),-dot3(uu,e),dot3(fwd,e),1];
 const asp=T.W/T.H,fy=1/Math.tan((asp<1?78:68)*Math.PI/360),n=.05,fr=600;
 const Pm=[fy/asp,0,0,0,0,fy,0,0,0,0,fr/(n-fr),-1,0,0,n*fr/(n-fr),0];
 for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=Pm[k*4+i]*V[j*4+k];VP[j*4+i]=s}
 ub.set(VP,0);ub.set(V,16);ub.set(inv4(VP),32);ub.set([P.x,P.y,P.z,t%1000],64);ub.set([T.W,T.H,1/T.W,1/T.H,fy/asp,fy,n,fr],96);
 device.queue.writeBuffer(ubuf,0,ub);
 pp.set([QS.has('dbg')?0:.045,QS.has('ex')?+QS.get('ex'):1.15,t%97,QS.has('dbg')||QS.has('ex')?1:0]);device.queue.writeBuffer(pbuf,0,pp);
 const enc=device.createCommandEncoder();
 let p=enc.beginRenderPass({colorAttachments:[
   {view:T.mC,resolveTarget:T.hdrV,clearValue:{r:0,g:0,b:0,a:1},loadOp:'clear',storeOp:'discard'},
   {view:T.mG,resolveTarget:T.gbV,clearValue:{r:0,g:0,b:6e4,a:0},loadOp:'clear',storeOp:'discard'},
   {view:T.mA,resolveTarget:T.axV,clearValue:{r:1,g:0,b:0,a:0},loadOp:'clear',storeOp:'discard'}],
  depthStencilAttachment:{view:T.depthV,depthClearValue:1,depthLoadOp:'clear',depthStoreOp:'discard'}});
 p.setBindGroup(0,sceneBG);p.setVertexBuffer(0,cubeVB);p.setVertexBuffer(1,instVB);p.setIndexBuffer(cubeIB,'uint16');if(!SK.has('scene')){p.setPipeline(scenePipe);p.drawIndexed(36,NI)}
 if(!SK.has('sky')){p.setPipeline(skyPipe);p.draw(3)}
 if(NG&&!SK.has('glass')){p.setPipeline(glassPipe);p.setVertexBuffer(1,glassVB);p.drawIndexed(36,NG)}
 p.end();
 p=enc.beginRenderPass({colorAttachments:[{view:T.fxR,loadOp:'clear',clearValue:{r:0,g:0,b:0,a:0},storeOp:'store'},{view:T.fxV,loadOp:'clear',clearValue:{r:0,g:0,b:0,a:0},storeOp:'store'}]});
 if(!SK.has('fx')){p.setPipeline(fxPipe);p.setBindGroup(0,T.fxBG);p.draw(3)}p.end();
 const fsPass=(view,load,pipe,b)=>{const q=enc.beginRenderPass({colorAttachments:[{view,loadOp:load?'load':'clear',clearValue:{r:0,g:0,b:0,a:1},storeOp:'store'}]});q.setPipeline(pipe);q.setBindGroup(0,b);q.draw(3);q.end()};
 fsPass(T.litV,0,combPipe,T.combBG);
 for(let i=0;i<BLV;i++)fsPass(T.dv[i],0,i?downPipe:down0Pipe,T.downBG[i]);
 for(let i=BLV-2;i>=0;i--)fsPass(T.dv[i],1,upPipe,T.upBG[i]);
 const cur=SNAP?T.snapTex:ctx.getCurrentTexture();fsPass(cur.createView(),0,finalPipe,T.finalBG);
 let snapBuf=null;const bpr=Math.ceil(T.W*4/256)*256;
 if(SNAP&&frames===+QS.get('snap')){snapBuf=device.createBuffer({size:bpr*T.H,usage:GU.COPY_DST|GU.MAP_READ});enc.copyTextureToBuffer({texture:cur},{buffer:snapBuf,bytesPerRow:bpr},[T.W,T.H])}
 device.queue.submit([enc.finish()]);
 if(snapBuf){const W=T.W,H=T.H;snapBuf.mapAsync(GPUMapMode.READ).then(()=>{const src=new Uint8Array(snapBuf.getMappedRange()),c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),im=g.createImageData(W,H);
  const bgr=fmt.startsWith('bgra');for(let y=0;y<H;y++)for(let x=0;x<W;x++){const s=y*bpr+x*4,d=(y*W+x)*4;im.data[d]=src[s+(bgr?2:0)];im.data[d+1]=src[s+1];im.data[d+2]=src[s+(bgr?0:2)];im.data[d+3]=255}
  g.putImageData(im,0,0);window.__snap=c.toDataURL('image/png')})}
 if(stats)$('i').textContent=`${fps} fps · ${T.W}×${T.H}\n${M.stores} stores · ${NI+NG} objects · ${M.lights.length} lights\nx ${P.x.toFixed(1)}  y ${P.y.toFixed(1)}  z ${P.z.toFixed(1)}  ${P.y>6?'Upper level':'Ground level'}`;
 window.__frames=++frames;
 requestAnimationFrame(frame)}
prog(1);await tick();
body.classList.remove('l');body.classList.add('r');
if(QS.has('go'))play();
requestAnimationFrame(frame);
})();
